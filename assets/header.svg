<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Hrishikesh Lenin — Student developer</title>
  <desc id="desc">A restrained editorial banner with a technical signal diagram for research, learning, and software tools.</desc>
  <style>
    .paper { fill: #f4f2ec; }
    .rule { stroke: #d4d8d1; }
    .ink { fill: #222a27; }
    .muted { fill: #69736e; }
    .accent { fill: #547c70; }
    .line { stroke: #547c70; }
    .grid { stroke: #dfe2dc; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #191e1c; }
      .rule { stroke: #38413c; }
      .ink { fill: #eeeee8; }
      .muted { fill: #aab2ac; }
      .accent { fill: #93b4a8; }
      .line { stroke: #93b4a8; }
      .grid { stroke: #2a322e; }
    }
    @media (prefers-reduced-motion: reduce) {
      .travel { display: none; }
    }
  </style>

  <rect class="paper" width="1200" height="300"/>
  <path class="grid" d="M735 32V268M815 32V268M895 32V268M975 32V268M1055 32V268M735 72H1135M735 152H1135M735 232H1135" fill="none" stroke-width="1" opacity=".5"/>
  <path class="rule" d="M64 250H1136" fill="none" stroke-width="1"/>

  <text class="muted" x="66" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2">SOFTWARE / RESEARCH / LEARNING</text>
  <text class="ink" x="62" y="145" font-family="Georgia, 'Times New Roman', serif" font-size="54" letter-spacing="-1.5">Hrishikesh Lenin</text>
  <text class="muted" x="66" y="184" font-family="Arial, Helvetica, sans-serif" font-size="18">Student developer · co-founder at Axiom Research</text>
  <path class="accent" d="M66 215H108" fill="none" stroke-width="3"/>
  <text class="muted" x="124" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.2">TOOLS / SYSTEMS / RESEARCH</text>

  <g fill="none" stroke-width="1.5">
    <path id="route" class="line" d="M760 192H825V112H905V192H985V72H1090"/>
    <path class="rule" d="M760 192H1090" stroke-dasharray="2 7"/>
  </g>
  <g class="muted" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing=".8">
    <text x="756" y="220">QUESTION</text>
    <text x="890" y="220">MODEL</text>
    <text x="1035" y="220">RESULT</text>
  </g>
  <g class="paper" stroke-width="2">
    <circle class="line" cx="760" cy="192" r="5"/>
    <circle class="line" cx="905" cy="192" r="5"/>
    <circle class="line" cx="1090" cy="72" r="5"/>
    <circle class="rule" cx="825" cy="112" r="4"/>
    <circle class="rule" cx="985" cy="72" r="4"/>
  </g>
  <circle class="travel accent" cx="760" cy="192" r="3">
