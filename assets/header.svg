<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Hrishikesh Lenin — Software, research, learning</title>
  <desc id="desc">A dark, minimal banner with a teal monogram and a short description of Hrishikesh's project areas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101b24"/><stop offset="1" stop-color="#101311"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67e8b5"/><stop offset="1" stop-color="#5ec7d0"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#9fb6b0" stroke-opacity=".075" stroke-width="1"/></pattern>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1110" cy="60" r="220" fill="#48c5a0" opacity=".055"/>
  <circle cx="1130" cy="65" r="155" fill="none" stroke="#67e8b5" stroke-opacity=".18"/>
  <circle cx="1130" cy="65" r="112" fill="none" stroke="#67e8b5" stroke-opacity=".13"/>
  <rect x="64" y="66" width="82" height="82" rx="22" fill="#19352f" stroke="#67e8b5" stroke-opacity=".55"/>
  <text x="105" y="120" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27" font-weight="700" fill="url(#accent)">HL</text>
  <text x="64" y="204" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="43" font-weight="700" fill="#f3f7f5">Hrishikesh Lenin</text>
  <text x="66" y="245" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" fill="#b3c4bf">Building software for research, learning, and developer tools.</text>
  <rect x="66" y="274" width="9" height="9" rx="4.5" fill="#67e8b5"/>
  <text x="86" y="283" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.2" fill="#8fa59e">AXIOM  ·  SLICE  ·  AEGISDB</text>
